[project]
name = "llm-provenance-classifier"
version = "0.1.0"
description = "Which small LLM wrote this passage? A calibrated, abstaining attribution baseline with governance guardrails."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy==2.5.4", "scipy==1.18.1", "scikit-learn==1.9.1"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4"]
generate = ["llama-cpp-python==0.3.36"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["provenance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905", "N803", "N806"]
